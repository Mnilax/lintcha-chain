# launch-refresh: manual-only until a strict full refresh is demonstrated through the routed log and state endpoints.
# When deliberately dispatched, rebuild the launch index and its numbers file from the most recent full day of
# launches, rebuild the pages that print their figures and integrity manifest, and open a PR containing the seven files. This is the job that
# writes a branch on its own, so every guardrail is hard and the job commits nothing rather than something
# wrong. Ported from lintcha's launch-refresh.yml (approved there 2026-09-08) with three differences, each marked
# "chain:" below: the vendored code is guarded by verify-vendor instead of a hash of the frozen rule files (there are
# none here); the page is rebuilt, because its figures and charts are baked in at build time; the membership test
# allows the integrity manifest, the three localized comparison pages and the root 404 alongside the two source artifacts.
#   - the collector runs over a day window ending at the latest finalised block. The owned loopback-only split
#     wrapper sends eth_getLogs to the checked-in public Robinhood endpoint and every state, transaction and header
#     request to the protected launch-refresh environment's RPC secret; its child receives only the localhost URL, and an absent secret refuses
#     the run before the collector starts
#   - the owned publication guard refuses an empty/partial run, incomplete records, malformed or duplicate factory
#     events, event hashes that disagree with finalized block headers, and strict ABI metadata/records that do not
#     rebuild the collector's exact tables and summaries. It reproduces the collector's transaction-sample counters,
#     fully proves exact direct factory/forwarder calls, and classifies other outer envelopes without interpreting
#     them; it re-reads the same finalized range with two smaller, differently aligned page layouts and compares
#     their complete canonical rows before anything is written. This catches page truncation/boundary omissions but
#     deliberately is not called an independent-provider proof because both alternate log layouts use the same
#     checked-in public log endpoint. Event hashes are separately bound to headers from the archive/state endpoint
#   - the writer validates the index against its schema before writing; the index test and the engine test then run
#     against the written files; a failure aborts before the commit
#   - the vendored files are checked three times (tools/verify-vendor.mjs: every row matches its hash, every file
#     under site/ src/ tests/ tools/ is a row or owned here): before the collector, right after the writer, after the
#     build; any change aborts and names itself. build/ is a build output in .gitignore and is never cleaned by hand
#   - the only paths that may change are site/launch-index.json, site/launch-numbers.json, site/launch-manifest.json,
#     site/index.html, site/es/index.html, site/pt/index.html and site/404.html; any
#     other modified, deleted or untracked path aborts before the commit
#   - GITHUB_TOKEN with contents, pull-requests and actions write; no personal token; the protected environment's archive/state provider secret is
#     exposed only to the two RPC-reading steps. Both actions are pinned by commit SHA. A unique draft PR is opened,
#     then the full test and vendor workflows are explicitly dispatched and awaited before the PR is marked ready,
#     because pushes made by GITHUB_TOKEN do not recursively trigger ordinary push workflows
name: launch-refresh
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: launch-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: launch-refresh
    # A local full-day collector took 26.03 minutes and its guard was still running at 66.7 minutes: the former
    # ninety-minute ceiling could terminate a healthy refresh before it reached the writer. 150 is that observed
    # 92.73-minute lower bound with a fifty-percent margin, rounded up to the next thirty-minute boundary.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Pin this run to the exact clean main revision
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "abort: launch-refresh must be dispatched from main"
            exit 1
          fi
          head_sha=$(git rev-parse HEAD)
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "abort: checkout HEAD does not match the dispatched revision"
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "${head_sha}" != "$(git rev-parse origin/main)" ]; then
            echo "abort: main moved before launch-refresh began; dispatch again from the new main"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "abort: checkout is not clean before launch-refresh"
            exit 1
          fi

      - name: the vendored files match their table before anything runs   # chain: replaces lintcha's hash of the frozen rule files
        run: |
          node tools/verify-vendor.mjs

      - name: collect the most recent full day through the loopback split RPC
        env:
          LINTCHA_CHAIN_RPC_URL: ${{ secrets.LINTCHA_CHAIN_RPC_URL }}
        run: |
          node tools/with-launch-rpc-split.mjs -- node tools/launch-collect.mjs --day --out "$RUNNER_TEMP/launch-day.json"

      - name: guard the collection through the loopback split RPC with alternate partitions and strict chain returns
        env:
          LINTCHA_CHAIN_RPC_URL: ${{ secrets.LINTCHA_CHAIN_RPC_URL }}
        run: |
          node tools/with-launch-rpc-split.mjs -- node tools/collection-guard.mjs --in "$RUNNER_TEMP/launch-day.json" --published site/launch-numbers.json --audit-logs

      - name: rebuild the index and the numbers file (the writer validates the index against its schema first)
        run: |
          node tools/launch-index.mjs --in "$RUNNER_TEMP/launch-day.json" --site site

      - name: the vendored files are unchanged after the writer   # chain: so a writer that touched a vendored file is named as the cause, before the tests speak
        run: |
          node tools/verify-vendor.mjs

      - name: guard test, schema/index test on the written files, and the engine test
        run: |
          node tests/collection_guard_test.mjs
          node tests/launch_index_test.mjs
          node tests/launch_test.js

      - name: rebuild the pages from the new figures   # chain: the window, charts and captions are baked into all comparison locales and the root 404
        run: |
          node tools/build.mjs
          node tests/chain_token_states.mjs
          node tests/published_contract_test.mjs

      - name: the vendored files are unchanged   # chain: verify-vendor again, after the collector, the writer and the build
        run: |
          node tools/verify-vendor.mjs

      - name: only the seven publication artifacts may have changed
        run: |
          # membership test: every status line must name one of the seven allowed paths, as a modification. Zero lines is
          # nothing to commit; lines naming only those paths commit; any other line aborts with the full status.
          git status --porcelain | tee "$RUNNER_TEMP/status.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/status.txt")" -eq 0 ]; then echo "nothing changed: the source artifacts, manifest, localized comparisons and root 404 are already this window"; echo "changed=0" >> "$GITHUB_ENV"; exit 0; fi
          if grep -v -x -E ' M site/(launch-(index|numbers|manifest)\.json|404\.html|(es/|pt/)?index\.html)' "$RUNNER_TEMP/status.txt"; then echo "abort: a path other than the seven publication artifacts changed, or one of them is not a plain modification; full status:"; cat "$RUNNER_TEMP/status.txt"; exit 1; fi
          echo "changed=1" >> "$GITHUB_ENV"

      - name: commit the seven publication artifacts, open a PR and dispatch its full review workflows
        if: env.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          base_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          if [ "${base_sha}" != "$(git rev-parse origin/main)" ]; then
            echo "abort: main moved during collection; regenerate from the new main rather than rebasing generated bytes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/launch-index.json site/launch-numbers.json site/launch-manifest.json site/index.html site/es/index.html site/pt/index.html site/404.html
          summary=$(node -p 'const n=require("./site/launch-numbers.json"); n.window.from_date+" to "+n.window.to_date+", blocks "+n.window.from_block+" to "+n.window.to_block+", "+n.launches_scanned+" launches, collected "+n.collected')
          git commit -m "launch index: manual refresh, ${summary}"
          generated_sha=$(git rev-parse HEAD)
          branch="automation/launch-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url=$(gh pr create --draft --base main --head "${branch}" --title "launch index: ${summary}" --body "Manual launch-refresh run ${GITHUB_RUN_ID}, guarded at one recorded finalized identity state. This PR contains only the seven generated publication artifacts; merge only after the dispatched full test and vendor workflows plus repository review checks pass.")
          gh workflow run test.yml --ref "${branch}"
          gh workflow run vendor.yml --ref "${branch}"
          test_run=""
          vendor_run=""
          for attempt in $(seq 1 30); do
            if [ -z "${test_run}" ]; then
              test_run=$(gh run list --workflow test.yml --branch "${branch}" --commit "${generated_sha}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            fi
            if [ -z "${vendor_run}" ]; then
              vendor_run=$(gh run list --workflow vendor.yml --branch "${branch}" --commit "${generated_sha}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            fi
            if [ -n "${test_run}" ] && [ -n "${vendor_run}" ]; then break; fi
            sleep 2
          done
          if [ -z "${test_run}" ] || [ -z "${vendor_run}" ]; then
            echo "abort: both explicitly dispatched test.yml and vendor.yml runs were not observable for ${branch}"
            exit 1
          fi
          gh run watch "${test_run}" --exit-status
          gh run watch "${vendor_run}" --exit-status
          git fetch --no-tags origin main
          if [ "${base_sha}" != "$(git rev-parse origin/main)" ]; then
            echo "abort: main moved while the review workflows ran; leave the PR in draft and regenerate from the new main"
            exit 1
          fi
          remote_head=$(git ls-remote origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')
          pr_head=$(gh pr view "${pr_url}" --json headRefOid --jq '.headRefOid')
          if [ "${remote_head}" != "${generated_sha}" ] || [ "${pr_head}" != "${generated_sha}" ]; then
            echo "abort: the automation branch or PR head moved after its exact generated commit was tested"
            exit 1
          fi
          gh pr ready "${pr_url}"
          echo "opened ${pr_url}; test.yml run ${test_run} and vendor.yml run ${vendor_run} passed for ${generated_sha}, both PR heads still match, main is unchanged, and the PR is ready for repository review"
