# verify-vendor on every push and pull request: lintcha is the source of the launch engine and this repository only
# receives copies, so the table in VENDOR.md must match the tree byte for byte (spec section 3). Two actions, both
# pinned by commit SHA, read-only permissions, no repository secret or personal token; checkout uses the read-only
# GITHUB_TOKEN supplied by Actions.
name: vendor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node tools/verify-vendor.mjs
