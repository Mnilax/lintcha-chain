name = "lintcha-copy-executor"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Private service only: no public routes. The id is intentionally a local placeholder until owner setup.
[[d1_databases]]
binding = "EXECUTOR_DB"
database_name = "lintcha-copy-executor"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
EXECUTOR_ENABLED = "false"
EXECUTOR_GLOBAL_PAUSED = "true"
EXECUTOR_CHAIN_ID = "4663"
EXECUTOR_CONTRACT_ADDRESS = ""
EXECUTOR_MAX_TRANSACTION_WEI = "0"
EXECUTOR_MAX_TTL_SECONDS = "120"

# Staged only as Worker secrets/secret config after review:
# PRIVY_APP_ID, PRIVY_APP_SECRET, PRIVY_AUTHORIZATION_PRIVATE_KEY,
# PRIVY_AUTHORIZATION_SIGNER_ID, PRIVY_POLICY_ID, PRIVY_POLICY_OWNER_ID,
# PRIVY_POLICY_CONTENT_SHA256.
